name: 💖 MNAENCA CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'بناء APK؟'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  validate:
    name: ✅ Validate Files
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📋 List Files
        run: |
          echo "📁 جميع ملفات المشروع:"
          ls -la
          echo ""
          echo "📊 إحصائيات:"
          echo "  - عدد ملفات HTML: $(find . -name '*.html' | wc -l)"
          echo "  - عدد ملفات JS: $(find . -name '*.js' | wc -l)"
          echo "  - عدد الأسطر: $(find . -name '*.html' -o -name '*.js' | xargs wc -l | tail -1)"

      - name: 🔍 Validate HTML
        run: |
          echo "✅ التحقق من وجود جميع الملفات المطلوبة..."
          for file in index.html auth.html profile.html upload.html chat.html explore.html notifications.html settings.html firebase-config.js; do
            if [ -f "$file" ]; then
              echo "  ✅ $file - موجود"
            else
              echo "  ❌ $file - مفقود!"
              exit 1
            fi
          done
          echo ""
          echo "💖 جميع الملفات موجودة!"

      - name: 🔑 Check Firebase Config
        run: |
          echo "التحقق من إعدادات Firebase..."
          if grep -q "somf-8adca" firebase-config.js; then
            echo "  ✅ Firebase: somf-8adca"
          else
            echo "  ⚠️ Firebase config غير متطابق"
          fi
          if grep -q "dt0tkbtzw" firebase-config.js; then
            echo "  ✅ Cloudinary: dt0tkbtzw"
          else
            echo "  ⚠️ Cloudinary config غير متطابق"
          fi

  build-apk:
    name: 🚀 Build APK
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_apk == 'true'
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
